name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          modules: qtquick3d qtshadertools
          cache: true
      - name: qmlformat check
        run: |
          shopt -s globstar
          failed=0
          for f in src/qml/**/*.qml; do
            if ! qmlformat "$f" | diff -u "$f" - > /dev/null; then
              echo "needs formatting: $f"
              failed=1
            fi
          done
          exit $failed
      - name: qmllint
        run: |
          shopt -s globstar
          qmllint src/qml/**/*.qml
