name: Bug report
description: Report something broken in totm
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc123, Qt 6.8.2, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. New tab, 2. Draw rectangle, 3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
